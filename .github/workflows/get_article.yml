name: Get Article

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # every Monday at 06:00 UTC

jobs:
  fetch-article:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install fire requests markdown pandas 

      - name: Verify API key
        env:
          OUT_API_KEY: ${{ secrets.OUT_API_KEY }}
        run: python info/run.py whoami

      - name: Fetch article
        env:
          OUT_API_KEY: ${{ secrets.OUT_API_KEY }}
        run: python info/run.py fetch_generated

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles/ index.html
          git diff --cached --quiet || git commit -m "chore: fetch article $(date +%Y%m%d)"
          git push
